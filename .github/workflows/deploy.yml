name: CI/CD Pipeline - SDD Project

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Security Scan (SonarQube/SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy para AWS EC2
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            rm -rf sistema-sdd
            git clone https://github.com/${{ github.repository }}.git
            cd sistema-sdd
            docker build -t app-sdd ./src
            docker stop app-container || true
            docker rm app-container || true
            docker run -d --name app-container -p 80:5000 app-sdd